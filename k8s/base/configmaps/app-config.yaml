apiVersion: v1
kind: ConfigMap
metadata:
  name: telescope-config
  namespace: telescope
data:
  NODE_ENV: "development"
  API_VERSION: "v1"
  API_HOST: "telescope-traefik.telescope.svc.cluster.local"
  WEB_URL: "http://localhost:8000"
  LOG_LEVEL: "info"
  GIT_COMMIT: "local-k8s"

  # Service ports
  POSTS_PORT: "5555"
  SEARCH_PORT: "4445"
  IMAGE_PORT: "4444"
  STATUS_PORT: "1111"
  SSO_PORT: "7777"
  FEED_DISCOVERY_PORT: "9999"
  PARSER_PORT: "10000"
  DEPENDENCY_DISCOVERY_PORT: "10500"

  # Internal service URLs (within cluster)
  POSTS_URL: "http://telescope-posts:5555/v1/posts"
  SEARCH_URL: "http://telescope-search:4445/v1/search"
  IMAGE_URL: "http://telescope-image:4444/v1/image"
  STATUS_URL: "http://telescope-status:1111/v1/status"
  SSO_URL: "http://telescope-sso:7777/v1/auth"
  FEED_DISCOVERY_URL: "http://telescope-feed-discovery:9999/v1/feed-discovery"
  PARSER_URL: "http://telescope-parser:10000/v1/parser"

  # Redis
  REDIS_URL: "redis://telescope-redis:6379"
  MOCK_REDIS: ""

  # Elasticsearch
  ELASTIC_URL: "http://telescope-elasticsearch"
  ELASTIC_PORT: "9200"
  ELASTIC_PORT: "9200"
  ELASTIC_MAX_RESULTS_PER_PAGE: "5"
  ELASTIC_DELAY_MS: "10000"
  MOCK_ELASTIC: ""

  # SSO / SAML
  SSO_LOGIN_URL: "http://telescope-login:8080/simplesaml/saml2/idp/SSOService.php"
  SSO_LOGIN_CALLBACK_URL: "http://localhost/v1/auth/login/callback"
  SLO_LOGOUT_CALLBACK_URL: "http://localhost/v1/auth/logout/callback"
  SLO_LOGOUT_URL: "http://telescope-login:8080/simplesaml/saml2/idp/SingleLogoutService.php"
  SAML_ENTITY_ID: "http://localhost/v1/auth/sp"
  JWT_ISSUER: "http://localhost/v1/auth"
  JWT_AUDIENCE: "http://localhost"
  JWT_EXPIRES_IN: "1h"
  ALLOWED_APP_ORIGINS: "http://localhost:8000"
  ADMINISTRATORS: "user1@example.com"
  TELESCOPE_ADMINS: "user1@example.com"

  # Feed settings
  FEED_URL: "https://wiki.cdot.senecacollege.ca/wiki/Planet_CDOT_Feed_List"
  FEED_URL_INTERVAL_MS: "30000"
  FEED_PROCESSING_DELAY_SEC: "3600"
  FEED_QUEUE_ATTEMPTS: "5"
  FEED_QUEUE_DELAY_MS: "60000"
  FEED_QUEUE_PARALLEL_WORKERS: "1"
  MAX_POSTS_PER_PAGE: "5"

  # Supabase
  SUPABASE_URL: "http://localhost/v1/supabase"
  SITE_URL: "http://localhost:8000"
  ADDITIONAL_REDIRECT_URLS: ""
  JWT_EXPIRY: "3600"
  DISABLE_SIGNUP: "true"
  ENABLE_EMAIL_SIGNUP: "false"
  ENABLE_EMAIL_AUTOCONFIRM: "false"
  ENABLE_PHONE_SIGNUP: "false"
  ENABLE_PHONE_AUTOCONFIRM: "false"
  SMTP_ADMIN_EMAIL: "admin@example.com"
  SMTP_HOST: "mail"
  SMTP_PORT: "2500"
  SMTP_USER: "fake_mail_user"
  SMTP_PASS: "fake_mail_password"
  SMTP_SENDER_NAME: "fake_sender"
  STUDIO_PORT: "8910"
