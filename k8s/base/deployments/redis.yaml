apiVersion: apps/v1
kind: Deployment
metadata:
  name: telescope-redis
  namespace: telescope
  labels:
    app: telescope-redis
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telescope-redis
  template:
    metadata:
      labels:
        app: telescope-redis
        tier: infrastructure
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
