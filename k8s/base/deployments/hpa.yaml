apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telescope-posts-hpa
  namespace: telescope
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telescope-posts
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telescope-search-hpa
  namespace: telescope
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telescope-search
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
