apiVersion: apps/v1
kind: Deployment
metadata:
  name: telescope-status
  namespace: telescope
  labels:
    app: telescope-status
    tier: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telescope-status
  template:
    metadata:
      labels:
        app: telescope-status
        tier: microservice
    spec:
      containers:
        - name: status
          image: telescope/status:local
          imagePullPolicy: Never
          ports:
            - containerPort: 1111
          envFrom:
            - configMapRef:
                name: telescope-config
            - secretRef:
                name: telescope-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 1111
            initialDelaySeconds: 15
            periodSeconds: 10
