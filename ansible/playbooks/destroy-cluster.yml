---
- name: Destroy all AWS infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Confirm destruction
      pause:
        prompt: |

          WARNING: This will destroy ALL AWS resources.
          EKS, VPC, ECR, IAM, RDS, NAT Gateway, Security Groups.
          The S3 state bucket and DynamoDB lock table are preserved.

          Type 'destroy' to confirm
      register: confirm

    - name: Remove Kubernetes resources first
      shell: |
        aws eks update-kubeconfig \
          --name telescope-dev-eks \
          --region {{ aws_region }} 2>/dev/null || true
        kubectl delete ingress telescope-ingress \
          -n {{ telescope_namespace }} 2>/dev/null || true
        kubectl delete svc grafana \
          -n {{ monitoring_namespace }} 2>/dev/null || true
        echo "Waiting 30s for AWS to remove load balancers..."
        sleep 30
      when: confirm.user_input == 'destroy'
      ignore_errors: true
      changed_when: true

    - name: Terraform destroy
      shell: cd {{ tf_dir }} && terraform destroy -auto-approve
      when: confirm.user_input == 'destroy'
      changed_when: true

    - name: Verify no billable resources remain
      shell: |
        echo "=== EKS Clusters ==="
        aws eks list-clusters --region {{ aws_region }} --output text

        echo "=== NAT Gateways ==="
        aws ec2 describe-nat-gateways \
          --filter Name=state,Values=available \
          --region {{ aws_region }} \
          --query 'NatGateways[].NatGatewayId' \
          --output text

        echo "=== Load Balancers ==="
        aws elbv2 describe-load-balancers \
          --region {{ aws_region }} \
          --query 'LoadBalancers[].LoadBalancerArn' \
          --output text

        echo "=== RDS Instances ==="
        aws rds describe-db-instances \
          --region {{ aws_region }} \
          --query 'DBInstances[].DBInstanceIdentifier' \
          --output text
      when: confirm.user_input == 'destroy'
      register: remaining
      changed_when: false

    - name: Remaining resources
      debug:
        var: remaining.stdout_lines
      when: confirm.user_input == 'destroy'

    - name: Cancelled
      debug:
        msg: "Cancelled. No resources changed."
      when: confirm.user_input != 'destroy'
