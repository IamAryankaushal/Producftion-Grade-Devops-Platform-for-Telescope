---
- name: Configure EKS cluster post-Terraform
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Read Terraform outputs
      shell: "cd {{ tf_dir }} && terraform output -json"
      register: tf_outputs_raw
      changed_when: false

    - name: Parse Terraform outputs
      set_fact:
        tf: "{{ tf_outputs_raw.stdout | from_json }}"
        ecr_registry_url: "{{ (tf_outputs_raw.stdout | from_json).ecr_registry_url.value }}"

    - name: Configure kubectl for EKS
      shell: |
        aws eks update-kubeconfig \
          --name {{ tf.eks_cluster_name.value }} \
          --region {{ aws_region }}
      changed_when: true

    - name: Create namespaces
      shell: |
        kubectl create namespace {{ item }} \
          --dry-run=client -o yaml | kubectl apply -f -
      with_items:
        - "{{ telescope_namespace }}"
        - "{{ monitoring_namespace }}"
      changed_when: true

    - name: Patch and restart CoreDNS for Fargate
      shell: |
        kubectl patch deployment coredns \
          -n kube-system \
          --type json \
          -p='[{"op":"remove","path":"/spec/template/metadata/annotations/eks.amazonaws.com~1compute-type"}]' \
          2>/dev/null || true
        kubectl rollout restart deployment coredns -n kube-system
        kubectl rollout status deployment coredns -n kube-system --timeout=180s
      changed_when: true

    - name: Add Helm repositories
      shell: |
        helm repo add eks https://aws.github.io/eks-charts
        helm repo add prometheus-community \
          https://prometheus-community.github.io/helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo update
      changed_when: true

    - name: Install AWS Load Balancer Controller
      shell: |
        helm upgrade --install aws-load-balancer-controller \
          eks/aws-load-balancer-controller \
          --namespace kube-system \
          --set clusterName={{ tf.eks_cluster_name.value }} \
          --set serviceAccount.create=true \
          --set serviceAccount.name=aws-load-balancer-controller \
          --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="{{ tf.alb_controller_role_arn.value }}" \
          --set region={{ aws_region }} \
          --set vpcId={{ tf.vpc_id.value }} \
          --wait --timeout=5m
      changed_when: true

# ── Monitoring role ───────────────────────────────────────────────────────────
- name: Deploy monitoring stack
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - monitoring

# ── Docker role — build and push images ──────────────────────────────────────
- name: Build and push service images to ECR
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    build_images: true
    push_images: true
  tasks:
    - name: Read ECR registry URL from Terraform
      shell: "cd {{ tf_dir }} && terraform output -raw ecr_registry_url"
      register: ecr_url
      changed_when: false

    - name: Set ECR registry fact
      set_fact:
        ecr_registry_url: "{{ ecr_url.stdout }}"

  roles:
    - docker

# ── Deploy Kubernetes manifests ───────────────────────────────────────────────
- name: Deploy Telescope to EKS
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Read Terraform outputs
      shell: "cd {{ tf_dir }} && terraform output -json"
      register: tf_raw
      changed_when: false

    - name: Parse outputs
      set_fact:
        tf: "{{ tf_raw.stdout | from_json }}"

    - name: Update kustomize production overlay with ECR image URLs
      shell: |
        REGISTRY="{{ tf.ecr_registry_url.value }}"
        cd {{ k8s_dir }}/overlays/production
        for svc in posts search image status feed-discovery sso parser; do
          kustomize edit set image \
            telescope/$svc=$REGISTRY/telescope/$svc:latest
        done
      changed_when: true
      args:
        executable: /bin/bash

    - name: Update ConfigMap with RDS endpoint
      shell: |
        kubectl patch configmap telescope-config \
          -n {{ telescope_namespace }} \
          --type merge \
          -p '{"data":{
            "DATABASE_URL":"postgresql://telescope_admin:{{ lookup(\"env\", \"TF_VAR_db_password\") }}@{{ tf.rds_host.value }}:{{ tf.rds_port.value }}/{{ tf.rds_db_name.value }}"
          }}'
      changed_when: true
      ignore_errors: true

    - name: Apply Telescope manifests
      shell: kubectl apply -k {{ k8s_dir }}/overlays/production/
      changed_when: true

    - name: Wait for telescope pods
      shell: |
        kubectl wait --for=condition=available \
          deployment --all \
          -n {{ telescope_namespace }} \
          --timeout=300s
      ignore_errors: true
      changed_when: false

    - name: Wait for ALB to be assigned
      shell: |
        for i in $(seq 1 20); do
          HOST=$(kubectl get ingress telescope-ingress \
            -n {{ telescope_namespace }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
            2>/dev/null || echo "")
          [ -n "$HOST" ] && echo "$HOST" && exit 0
          echo "Waiting for ALB... ($i/20)" >&2
          sleep 15
        done
        echo "not-ready-yet"
      register: alb_hostname
      changed_when: false

    - name: Print final summary
      debug:
        msg:
          - "========================================================"
          - "  Telescope is live on AWS EKS (ap-south-1)"
          - "========================================================"
          - "  Posts:   http://{{ alb_hostname.stdout }}/v1/posts"
          - "  Search:  http://{{ alb_hostname.stdout }}/v1/search"
          - "  Status:  http://{{ alb_hostname.stdout }}/v1/status"
          - "  RDS:     {{ tf.rds_host.value }}:{{ tf.rds_port.value }}"
          - "========================================================"
          - "  Run ./scripts/aws-teardown.sh when done"
          - "========================================================"
