---
- name: Configure EKS cluster post-Terraform
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tf_dir: "{{ playbook_dir }}/../../terraform/environments/dev"
    k8s_dir: "{{ playbook_dir }}/../../k8s"
    aws_region: "ap-south-1"

  tasks:
    - name: Read Terraform outputs
      shell: "cd {{ tf_dir }} && terraform output -json"
      register: tf_outputs_raw
      changed_when: false

    - name: Parse Terraform outputs
      set_fact:
        tf: "{{ tf_outputs_raw.stdout | from_json }}"

    - name: Show key outputs
      debug:
        msg:
          - "Cluster: {{ tf.eks_cluster_name.value }}"
          - "ECR registry: {{ tf.ecr_registry_url.value }}"
          - "ALB controller role: {{ tf.alb_controller_role_arn.value }}"

    - name: Configure kubectl for EKS cluster
      shell: |
        aws eks update-kubeconfig \
          --name {{ tf.eks_cluster_name.value }} \
          --region {{ aws_region }}
      changed_when: true

    - name: Create telescope namespace
      shell: |
        kubectl create namespace telescope \
          --dry-run=client -o yaml | kubectl apply -f -
      changed_when: true

    - name: Create monitoring namespace
      shell: |
        kubectl create namespace monitoring \
          --dry-run=client -o yaml | kubectl apply -f -
      changed_when: true

    - name: Patch CoreDNS to remove Fargate annotation
      shell: |
        kubectl patch deployment coredns \
          -n kube-system \
          --type json \
          -p='[{"op":"remove","path":"/spec/template/metadata/annotations/eks.amazonaws.com~1compute-type"}]'
      ignore_errors: true
      changed_when: true

    - name: Restart CoreDNS
      shell: kubectl rollout restart deployment coredns -n kube-system
      changed_when: true

    - name: Wait for CoreDNS rollout
      shell: |
        kubectl rollout status deployment coredns \
          -n kube-system --timeout=180s
      changed_when: false

    - name: Add Helm repositories
      shell: |
        helm repo add eks https://aws.github.io/eks-charts
        helm repo add prometheus-community \
          https://prometheus-community.github.io/helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo update
      changed_when: true

    - name: Install AWS Load Balancer Controller
      shell: |
        helm upgrade --install aws-load-balancer-controller \
          eks/aws-load-balancer-controller \
          --namespace kube-system \
          --set clusterName={{ tf.eks_cluster_name.value }} \
          --set serviceAccount.create=true \
          --set serviceAccount.name=aws-load-balancer-controller \
          --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="{{ tf.alb_controller_role_arn.value }}" \
          --set region={{ aws_region }} \
          --set vpcId={{ tf.vpc_id.value }} \
          --wait --timeout=5m
      changed_when: true

    - name: Install Prometheus
      shell: |
        helm upgrade --install prometheus \
          prometheus-community/prometheus \
          --namespace monitoring \
          --set server.persistentVolume.enabled=false \
          --set alertmanager.enabled=false \
          --set pushgateway.enabled=false \
          --wait --timeout=5m
      changed_when: true

    - name: Install Grafana
      shell: |
        helm upgrade --install grafana grafana/grafana \
          --namespace monitoring \
          --set adminPassword=telescope123 \
          --set persistence.enabled=false \
          --set service.type=LoadBalancer \
          --wait --timeout=5m
      changed_when: true

    - name: Login to ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} \
          | docker login \
          --username AWS \
          --password-stdin {{ tf.ecr_registry_url.value }}
      changed_when: true

    - name: Build and push all service images to ECR
      shell: |
        TELESCOPE_DIR="{{ playbook_dir }}/../../telescope"
        REGISTRY="{{ tf.ecr_registry_url.value }}"
        DEVOPS_DIR="{{ playbook_dir }}/../.."
        SERVICES=(posts search status feed-discovery sso parser)

        for svc in "${SERVICES[@]}"; do
          SVC_DIR="$TELESCOPE_DIR/src/api/$svc"
          if [ -f "$SVC_DIR/Dockerfile" ]; then
            echo "Building $svc..."
            docker build \
              -t "$REGISTRY/telescope/$svc:latest" \
              -f "$SVC_DIR/Dockerfile" \
              "$SVC_DIR/"
            docker push "$REGISTRY/telescope/$svc:latest"
            echo "[✓] $svc pushed"
          fi
        done

        # image service uses custom Dockerfile for sharp/musl fix
        echo "Building image service (custom Dockerfile)..."
        docker build \
          -t "$REGISTRY/telescope/image:latest" \
          -f "$DEVOPS_DIR/docker/image.Dockerfile" \
          "$TELESCOPE_DIR/src/api/image/"
        docker push "$REGISTRY/telescope/image:latest"
        echo "[✓] image pushed"
      changed_when: true
      args:
        executable: /bin/bash

    - name: Update production kustomize overlay with ECR URLs
      shell: |
        REGISTRY="{{ tf.ecr_registry_url.value }}"
        cd {{ k8s_dir }}/overlays/production
        SERVICES=(posts search image status feed-discovery sso parser)
        for svc in "${SERVICES[@]}"; do
          kustomize edit set image \
            telescope/$svc=$REGISTRY/telescope/$svc:latest
        done
      changed_when: true
      args:
        executable: /bin/bash

    - name: Apply Telescope Kubernetes manifests
      shell: kubectl apply -k {{ k8s_dir }}/overlays/production/
      changed_when: true

    - name: Wait for telescope deployments
      shell: |
        kubectl wait --for=condition=available \
          deployment --all \
          -n telescope \
          --timeout=300s
      ignore_errors: true
      changed_when: false

    - name: Get ALB ingress hostname
      shell: |
        for i in $(seq 1 20); do
          HOST=$(kubectl get ingress telescope-ingress \
            -n telescope \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
            2>/dev/null || echo "")
          if [ -n "$HOST" ]; then
            echo "$HOST"
            exit 0
          fi
          echo "Waiting for ALB... ($i/20)" >&2
          sleep 15
        done
        echo "ALB not ready yet — check: kubectl get ingress -n telescope"
      register: alb_hostname
      changed_when: false

    - name: Get Grafana hostname
      shell: |
        kubectl get svc grafana -n monitoring \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
          2>/dev/null || echo "not ready yet"
      register: grafana_hostname
      changed_when: false

    - name: Print final access information
      debug:
        msg:
          - "========================================================"
          - "  Telescope is live on AWS EKS (ap-south-1)"
          - "========================================================"
          - "  Posts API:  http://{{ alb_hostname.stdout }}/v1/posts"
          - "  Status API: http://{{ alb_hostname.stdout }}/v1/status"
          - "  Search API: http://{{ alb_hostname.stdout }}/v1/search"
          - "  Grafana:    http://{{ grafana_hostname.stdout }}"
          - "              admin / telescope123"
          - "========================================================"
          - "  Run ./scripts/aws-teardown.sh when done to stop billing"
          - "========================================================"
