global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: /metrics

  - job_name: 'telescope-posts'
    static_configs:
      - targets: ['posts:4444']
    metrics_path: /v1/metrics

  - job_name: 'telescope-search'
    static_configs:
      - targets: ['search:4445']
    metrics_path: /v1/metrics

  - job_name: 'telescope-status'
    static_configs:
      - targets: ['status:4448']
    metrics_path: /v1/metrics

  - job_name: 'telescope-image'
    static_configs:
      - targets: ['image:4446']
    metrics_path: /v1/metrics

  - job_name: 'telescope-feed-discovery'
    static_configs:
      - targets: ['feed-discovery:4447']
    metrics_path: /v1/metrics

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metrics_path: /_prometheus/metrics
